spring:
  application:
    name: proyecto

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  timezone: America/Guayaquil

# Límites de la tabla del Punto 7. Fijos por enunciado, por eso
# viven aquí y no en los perfiles dev/prod.
rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  login:
    max-requests: 5
    window-seconds: 60
  register:
    max-requests: 3
    window-seconds: 3600
  public-endpoints:
    max-requests: 60
    window-seconds: 60
  authenticated:
    max-requests: 120
    window-seconds: 60
  reports:
    max-requests: 5
    window-seconds: 60
